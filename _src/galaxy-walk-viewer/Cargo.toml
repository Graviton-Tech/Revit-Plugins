[package]
name = "galaxy_walk"
version = "0.1.0"
edition = "2021"
description = "Galaxy Walk - real-time walkthrough viewer for Revit models"

[[bin]]
name = "galaxy_walk"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
glam = { version = "0.29", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
